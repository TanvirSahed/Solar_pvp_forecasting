# pvf defaults. Data processing follows how the processed datasets were built (30-min P/G/T, Ineichen clear-sky);
# the experimental protocol below is our own and freely changeable.
seed: 0
deterministic: false      # true -> bit-identical reruns on the same GPU (slower)
site: ssp                 # ssp | nist
device: cuda
out_dir: runs
tag: ""
eval_splits: [val, test, holdout]

data:
  freq: 30min
  lookback: 128           # L = 64 h of 30-min history
  horizon: 48             # H steps -> 0.5..24 h, all predicted jointly (direct multi-output)
  tau_day: 10.0           # daytime target if clear-sky GHI > 10 W/m2
  oracle_weather: false   # true -> measured future G,T as perfect-NWP proxy (upper bound; no NWP archive yet)
  adapt_months: null      # e.g. [11, 12] -> unlabelled target-domain inputs for dt_dann
  split:
    mode: blocked         # blocked | months   (see pvf/data/splits.py)
    block_days: 7
    pattern: [train, train, train, train, val, test]   # cyclic weekly blocks -> every season in every split
    holdout_months: []    # e.g. [12] -> untouched final test, reported as split "holdout"
    # mode: months -> train: [1,2,3,4,5,6,7,8]  val: [9]  test: [10,11,12]
    train: [1, 2, 3, 4, 5, 6, 7, 8]
    val: [9]
    test: [10, 11, 12]

train:
  epochs: 100
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adam         # adam | adamw
  scheduler: none         # none | cosine
  loss: mse               # mse | mae | huber  (quantile models always use pinball)
  patience: 10
  grad_clip: 1.0
  amp: bf16               # bf16 | fp16 | none  (RTX 3060 = Ampere -> bf16 OK)
  num_workers: 0          # Windows: keep 0; Linux/Docker: 4

model:
  name: lstm
